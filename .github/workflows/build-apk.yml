name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK platform 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          echo "Repo files:"; find . -maxdepth 3 -not -path './.git/*' | head -50
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts repo ma nathi. Project files upload karo."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BarcodeInventoryBilling-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
